name: Release

# Fires on any tag starting with "v" (v0.2.0, v1.2.3, ...). Push a tag to
# release: git tag vX.Y.Z && git push origin vX.Y.Z.
#
# Builds the native library on a native runner per platform (_build.yml) and
# tests each one, then publishes a single package that carries all six
# libraries under dist/native/ (the loader picks the one for the machine).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # to create the GitHub release
  id-token: write # OIDC token for npm trusted publishing

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match package.json version $pkg_version"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/_build.yml
    with:
      node-versions: '["22"]'

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # npm trusted publishing needs npm >= 11.5.1, which needs Node >=
          # 22.14 to come bundled; the extra `npm install -g` below pins the
          # npm CLI version explicitly instead of trusting whatever a given
          # Node build happens to bundle.
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure a trusted-publishing-capable npm CLI
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # tsup wipes dist/, so build the JS first and only then drop the
      # natives in. (prepublishOnly below only *checks* for them and never
      # rebuilds, so it can't undo this.)
      - run: npm run build:js

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native

      - name: Check all six native libraries are present
        run: node scripts/check-natives.mjs

      - name: Pack tarball
        run: npm pack

      # Authenticates via GitHub's OIDC token (the id-token: write permission
      # above) instead of an NPM_TOKEN secret — npm's "trusted publishing".
      # This requires the package's Trusted Publisher to be configured on
      # npmjs.com first: package Settings -> Trusted Publisher -> GitHub
      # Actions, with this repo and the workflow filename "release.yml".
      # Provenance attestations are generated automatically as part of that
      # same OIDC exchange, no --provenance flag needed.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "*.tgz"
