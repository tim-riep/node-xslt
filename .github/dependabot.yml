version: 2
updates:
  # The go-xslt engine compiled into the native libraries.
  - package-ecosystem: gomod
    directory: /native
    schedule:
      interval: daily
    allow:
      - dependency-name: github.com/tim-riep/go-xslt
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the Go port) has no compiler API yet, which tsup's
      # declaration build (rollup-plugin-dts) needs. Stay on 6.x until it does.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
